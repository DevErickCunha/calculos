<div class="p-6 bg-white rounded-lg shadow-lg w-96">
        <h2 class="text-xl font-bold mb-4">Preencha o formulário</h2>
        <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Nome</mat-label>
            <input matInput formControlName="name" />
            <mat-error *ngIf="form.controls['name'].invalid && form.controls['name'].touched">
            Nome é obrigatório.
            </mat-error>
        </mat-form-field>
    
        <mat-form-field appearance="outline" class="w-full">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" />
            <mat-error *ngIf="form.controls['email'].invalid && form.controls['email'].touched">
            Insira um email válido.
            </mat-error>
        </mat-form-field>
    
        <div class="flex justify-end gap-2 mt-4">
            <button type="button" (click)="cancel()" class="px-4 py-2 bg-gray-300 rounded">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded" [disabled]="form.invalid">Enviar</button>
        </div>
    </form>
</div>
