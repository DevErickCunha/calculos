<button mat-button (click)="openDialog()">Abrir Modal</button>

<!-- Exibindo os dados recebidos do modal -->
    @for (item of listaDeFormularios; track idx; let idx = $index ) {
        <div  class="mt-4 p-4 bg-gray-100 rounded">
            <li>{{ item.name }}</li>
            <li>{{ item.email }}</li>
        </div>
        } @empty {
        <li>There are no items.</li>
        }
