<button mat-button (click)="openDialog()">Abrir Modal</button>

<!-- Exibindo os dados recebidos do modal -->
<div *ngIf="formData" class="mt-4 p-4 bg-gray-100 rounded">
    <h3 class="font-bold">Dados Recebidos:</h3>
    <p><strong>Nome:</strong> {{ formData.name }}</p>
    <p><strong>Email:</strong> {{ formData.email }}</p>
</div>
